name: Test Client

on:
  push:
    branches-ignore:
      - main

jobs:
  test:
    name: Setup
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@latest

      - name: Set up Node
        uses: actions/setup-node@latest
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install NPM Packages
        run: npm ci
        working-directory: ./client

      - name: Run Tests
        run: npm test
        working-directory: ./client